[package]
name = "rox-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ROX format implementations — osu, taiko, sm, qua, fnf, jrox, yrox, rox native"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = [
    "rox/std",
    "dep:serde_yaml",
    "dep:memmap2",
    "alloc",
]
alloc = ["rox/alloc"]
wasm = []

[dependencies]
rox = { workspace = true }
rox-macros = { workspace = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_yaml = { version = "0.9", optional = true }
memmap2 = { version = "0.9", optional = true }
memchr = { version = "2.7", default-features = false }
atoi = { version = "2.0", default-features = false }
compact_str = { version = "0.9", default-features = false, features = ["serde"] }
rkyv = { version = "0.8", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false }
bitflags = { version = "2.9", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.13" }

[dev-dependencies]
rstest.workspace = true
rox-test-utils.workspace = true
