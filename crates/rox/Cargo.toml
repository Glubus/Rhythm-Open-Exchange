[package]
name = "rox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ROX model and codec traits — universal VSRG chart format"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = [
    "thiserror/std",
    "serde/std",
    "compact_str/std",
    "alloc",
]
alloc = []

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["alloc"] }
bitflags = { version = "2.9", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0", default-features = false }
compact_str = { version = "0.9.0", default-features = false, features = ["serde", "rkyv"] }
rox-macros = { path = "../macros" }

[dev-dependencies]
rstest.workspace = true
rox-macros.workspace = true
rox-test-utils.workspace = true
